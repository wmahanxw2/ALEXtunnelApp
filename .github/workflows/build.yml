name: Build ALEX tunnel APK

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "v2rayNG tag or branch (leave empty for the latest code)"
        default: ""
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branding
        uses: actions/checkout@v4

      - name: Checkout v2rayNG (upstream, GPLv3)
        uses: actions/checkout@v4
        with:
          repository: 2dust/v2rayNG
          ref: ${{ github.event.inputs.upstream_ref }}
          path: upstream
          submodules: recursive

      - name: Download latest Xray core (libv2ray.aar)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p upstream/V2rayNG/app/libs
          rm -f upstream/V2rayNG/app/libs/*.aar
          gh release download --repo 2dust/AndroidLibXrayLite --pattern "*.aar" \
            --dir upstream/V2rayNG/app/libs --clobber
          ls -la upstream/V2rayNG/app/libs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply ALEX tunnel branding
        run: |
          pip install pillow
          python3 branding/apply.py upstream

      - name: Native tunnel (only if upstream needs it)
        run: |
          if [ -f upstream/compile-hevtun.sh ]; then
            export NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk-bundle}"
            cd upstream && bash compile-hevtun.sh
          else
            echo "no native step"
          fi

      - name: Build APK
        shell: bash
        working-directory: upstream/V2rayNG
        run: |
          chmod +x gradlew
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g"
          if ! ./gradlew assembleFdroidDebug --no-daemon > ../../build.log 2>&1; then
            echo "fdroid build failed, trying all flavors"
            ./gradlew assembleDebug --no-daemon >> ../../build.log 2>&1 || true
          fi
          if ! find app/build/outputs/apk -name "*.apk" | grep -q .; then
            echo "=== ERRORS ==="
            grep -E "^e: |What went wrong" -A3 ../../build.log | head -60
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALEX-tunnel-apk
          path: upstream/V2rayNG/app/build/outputs/apk/**/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          i=0
          for f in $(find upstream/V2rayNG/app/build/outputs/apk -name "*.apk"); do
            i=$((i+1)); cp "$f" "out/ALEX-tunnel-v1.0.${{ github.run_number }}-$i.apk"
          done
          gh release create "v1.0.${{ github.run_number }}" out/*.apk --repo "${{ github.repository }}" \
            --title "ALEX Tunnel v1.0.${{ github.run_number }}" --generate-notes
