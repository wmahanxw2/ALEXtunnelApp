name: Build ALEX tunnel APK

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "v2rayNG branch / tag / commit SHA (the UI overlay was written against 2.3.10 on master)"
        default: "master"
  push:
    branches: [main]

permissions:
  contents: write

env:
  NDK_VERSION: "30.0.16248370"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branding
        uses: actions/checkout@v4

      - name: Checkout v2rayNG (upstream, GPLv3)
        uses: actions/checkout@v4
        with:
          repository: 2dust/v2rayNG
          ref: ${{ github.event.inputs.upstream_ref || 'master' }}
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: Apply ALEX tunnel branding + UI
        run: |
          pip install pillow
          python3 branding/apply.py upstream

      - name: Pin NDK version in the app module
        run: |
          grep -q "ndkVersion" upstream/V2rayNG/app/build.gradle.kts || \
            sed -i '10i\    ndkVersion = "'"${NDK_VERSION}"'"' upstream/V2rayNG/app/build.gradle.kts

      - name: Build native tunnel (hev-socks5-tunnel)
        working-directory: upstream
        run: |
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app

      - name: Fetch AndroidLibXrayLite tag
        working-directory: upstream/AndroidLibXrayLite
        run: |
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "AndroidLibXrayLite tag: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV

      - name: Download libv2ray.aar
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "2dust/AndroidLibXrayLite"
          tag: ${{ env.CURRENT_TAG }}
          fileName: "libv2ray.aar"
          out-file-path: upstream/V2rayNG/app/libs/

      - name: Build APK
        working-directory: upstream/V2rayNG
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          ./gradlew assemblePlaystoreDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALEX-tunnel-apk
          path: upstream/V2rayNG/app/build/outputs/apk/**/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          i=0
          for f in $(find upstream/V2rayNG/app/build/outputs/apk -name "*.apk"); do
            i=$((i+1)); cp "$f" "out/ALEX-tunnel-v1.0.${{ github.run_number }}-$i.apk"
          done
          gh release create "v1.0.${{ github.run_number }}" out/*.apk --repo "${{ github.repository }}" \
            --title "ALEX Tunnel v1.0.${{ github.run_number }}" --generate-notes
